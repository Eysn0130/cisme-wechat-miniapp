name: Temporary exact candidate materialization
on:
  push:
    branches: [codex/commercial-runtime-20260921]
    paths: [.github/workflows/commercial-source-preparation.yml]
permissions:
  contents: write
concurrency:
  group: cisme-commercial-runtime-materialization
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Verify sealed source patch and fast-forward only this task branch
        shell: bash
        env:
          EXPECTED_TREE: 0137b57b84466099c6e09e8be50a0cd0f324be19
          PATCH_SHA256: 8668ac64826248e4687045b9c63888906dc40d8e0a470774368743e870f7f156
        run: |
          set -euo pipefail
          branch=codex/commercial-runtime-20260921
          base=42e9b44db959000b10c8e6f4d0fd0e150fe69b89
          test "$GITHUB_REF_NAME" = "$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          helpers=(.github/workflows/commercial-source-preparation.yml .github/commercial-candidate.part1.b64 .github/commercial-candidate.part2.b64 .github/commercial-candidate.part3.b64)
          git diff --name-only "$base" HEAD | grep -Ev '^\.github/(workflows/commercial-source-preparation\.yml|commercial-candidate\.part[123]\.b64)$' > "$RUNNER_TEMP/unexpected-paths" || true
          test ! -s "$RUNNER_TEMP/unexpected-paths"
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          parts=[pathlib.Path(f'.github/commercial-candidate.part{i}.b64').read_bytes() for i in (1,2,3)]
          assert [blob(b) for b in parts]==['75fe986fd89bc27441409b615023c2f602fe12e8','078294549ecd2dc07212c2056a0145ecd42d56c2','3f4c548e50e18dc65d42746f7664844fe35188de']
          # The first strict CRC check caught one duplicated four-byte transfer
          # group. Correct exactly that known copy error, not the source patch.
          bad=b'B9fSz'+b'BfSz'*7+b'CHW';good=b'B9fSz'+b'BfSz'*6+b'CHW'
          assert parts[0].count(bad)==1
          parts[0]=parts[0].replace(bad,good,1)
          assert blob(parts[0])=='1ee551e995808506563098be6becf01f4fc9945b'
          patch=gzip.decompress(base64.b64decode(b''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']
          pathlib.Path(os.environ['RUNNER_TEMP'],'reviewed-candidate.patch').write_bytes(patch)
          PY
          patch="$RUNNER_TEMP/reviewed-candidate.patch"
          echo "$PATCH_SHA256  $patch" | sha256sum --check --strict
          git apply --index --unidiff-zero --whitespace=error "$patch"
          git diff --cached --check
          git rm --cached -- "${helpers[@]}"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git reset -q HEAD -- "${helpers[@]}"
          git diff --cached --check
          git config user.name 'ChatGPT CISME delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(native): decouple runtime reads and preserve gated financial history'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD HEAD^{tree}
          git show --stat --oneline HEAD
          # No tests are claimed here. Normal PR verify must pass on the final
          # helper-free HEAD before any merge. No deployment or real funds.
