name: Temporary redacted recovery scan diagnostic
on:
  pull_request:
    paths: [.github/workflows/recovery-secret-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/commercial-recovery-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Locate only rule, file and line; never return matched secret content
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          status=0
          "$scanner_dir/gitleaks" git . --no-banner --no-color --redact=100 --report-format json --report-path "$RUNNER_TEMP/redacted-scan.json" || status=$?
          test "$status" = 0 -o "$status" = 1
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'redacted-scan.json'
          rows=json.loads(p.read_text())
          for row in rows:print(json.dumps({k:row.get(k) for k in ['RuleID','File','StartLine','EndLine','Commit','Fingerprint']}))
          p.unlink()
          PY
          # Diagnostic success only means location retrieval; original verify
          # remains blocked until its unchanged scanner independently passes.
