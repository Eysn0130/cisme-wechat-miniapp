name: Temporary isolated recovery review toolchain
on:
  pull_request:
    paths: [.github/workflows/recovery-review-toolchain.yml]
permissions:
  contents: read
jobs:
  review-toolchain:
    if: github.head_ref == 'codex/commercial-recovery-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.18.0', cache: npm}
      - run: npm ci
      - name: Archive committed source and public lock-pinned tools only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/recovery-review"
          mkdir -p "$out" "$RUNNER_TEMP/recovery-runtime"
          git rev-parse HEAD HEAD^{tree} > "$out/checkout-identity.txt"
          sha256sum package-lock.json > "$out/lockfile.sha256"
          node --version > "$out/node-version.txt"
          git archive --format=tar HEAD | gzip -n > "$out/committed-source.tar.gz"
          # Explicit public artifacts only. Never archive .git, HOME, .npmrc,
          # caches, environment variables, credentials or generated app data.
          cp "$(command -v node)" "$RUNNER_TEMP/recovery-runtime/node"
          tar -czf "$out/runtime.tar.gz" -C "$RUNNER_TEMP/recovery-runtime" node
          tar -czf "$out/node-modules.tar.gz" node_modules
          (cd "$out" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-recovery-review
          path: ${{ runner.temp }}/recovery-review/
          retention-days: 3
