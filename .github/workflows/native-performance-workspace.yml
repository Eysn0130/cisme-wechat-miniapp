name: Native performance source snapshot
# Temporary task bootstrap; removed before merge. No secrets or deployment access.
on:
  push:
    branches: [codex/native-performance-repair-20260920]
    paths: [.github/workflows/native-performance-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Archive tracked public source only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/native-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/native-source/COMMIT"
          git ls-tree -r HEAD > "$RUNNER_TEMP/native-source/TREE"
          cd "$RUNNER_TEMP/native-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-performance-source
          path: ${{ runner.temp }}/native-source
          retention-days: 2
          if-no-files-found: error
