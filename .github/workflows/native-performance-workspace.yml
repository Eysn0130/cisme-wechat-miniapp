name: Native performance source snapshot
# Temporary task bootstrap; removed before merge. No secrets or deployment access.
on:
  push:
    branches: [codex/native-performance-repair-20260920]
    paths: [.github/workflows/native-performance-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export only existing compose test dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-database"
          docker pull postgres:18.4-alpine
          docker image inspect postgres:18.4-alpine > "$RUNNER_TEMP/native-database/postgres-image.json"
          id="$(docker create postgres:18.4-alpine)"
          docker export "$id" | gzip -1 > "$RUNNER_TEMP/native-database/postgres-rootfs.tar.gz"
          docker rm "$id"
          docker pull chrislusf/seaweedfs:4.29
          docker image inspect chrislusf/seaweedfs:4.29 > "$RUNNER_TEMP/native-database/seaweed-image.json"
          id="$(docker create chrislusf/seaweedfs:4.29)"
          docker cp "$id:/usr/bin/weed" "$RUNNER_TEMP/native-database/weed"
          docker rm "$id"
          cd "$RUNNER_TEMP/native-database"
          sha256sum postgres-rootfs.tar.gz weed postgres-image.json seaweed-image.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-performance-database
          path: ${{ runner.temp }}/native-database
          retention-days: 2
          if-no-files-found: error
