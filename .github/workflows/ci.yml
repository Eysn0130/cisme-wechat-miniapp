name: CISME R0 gates
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ['candidate-*']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24.18.0', cache: npm}
      - name: Diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            # The checkout is a synthetic merge commit; check both the actual
            # PR patch and the resulting target combination.
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            git diff --check "$BASE_SHA" HEAD
          elif [ -n "$BEFORE_SHA" ] &&
            [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ] &&
            git cat-file -e "$BEFORE_SHA^{commit}"; then
            git diff --check "$BEFORE_SHA" HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi
      - name: Secret scan (Gitleaks 8.30.1, verified archive)
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --no-banner --no-color --redact=100
      - name: Create bounded verification evidence directory
        run: mkdir -p "$RUNNER_TEMP/native-validation"
      - run: npm ci 2>&1 | tee "$RUNNER_TEMP/native-validation/ci.log"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee "$RUNNER_TEMP/native-validation/audit-omit=dev-audit-level=high.log"
      - name: Development-tool high-severity audit
        run: npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/native-validation/audit-audit-level=high.log"
      - run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/native-validation/typecheck.log"
      - run: npm run miniprogram:package-gate 2>&1 | tee "$RUNNER_TEMP/native-validation/miniprogram-package-gate.log"
      - run: npm run miniprogram:route-audit 2>&1 | tee "$RUNNER_TEMP/native-validation/miniprogram-route-audit.log"
      - run: npm run design:qa:status 2>&1 | tee "$RUNNER_TEMP/native-validation/design-qa-status.log"
      - run: npm test 2>&1 | tee "$RUNNER_TEMP/native-validation/test.log"
      - run: npm run test:integration 2>&1 | tee "$RUNNER_TEMP/native-validation/test-integration.log"
      - run: npm run restore:verify 2>&1 | tee "$RUNNER_TEMP/native-validation/synthetic-restore.log"
      - run: npm run build 2>&1 | tee "$RUNNER_TEMP/native-validation/build.log"
      - run: npm run lint:contracts 2>&1 | tee "$RUNNER_TEMP/native-validation/lint-contracts.log"
      - name: Isolated same-runner performance comparison (not native acceptance)
        env:
          PERF_ALLOW_RESET: 'true'
          PERF_SAMPLES: '4000'
          PERF_CONCURRENCY: '10'
          PERF_P95_MS: '500'
          CAPACITY_ALLOW_RESET: 'true'
          CAPACITY_FIXTURE_USERS: '100'
          CAPACITY_LEVELS: '10,20'
          CAPACITY_ROUNDS: '2'
          CAPACITY_REQUESTS_PER_WORKER: '50'
          CAPACITY_CLIENT_MODE: loopback-population
          WORKER_CAPACITY_EVENTS: '1000'
          WORKER_CAPACITY_LEVELS: '1,2'
          WORKER_CAPACITY_ROUNDS: '2'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-validation"
          git rev-parse HEAD > "$out/checkout-sha.txt"
          git status --porcelain > "$out/pre-perf-worktree.txt"
          node scripts/native-feed-benchmark.mjs > "$out/feed-before-after.json"
          baseline="$RUNNER_TEMP/cisme-perf-baseline"
          mkdir -p "$baseline"
          git archive 56432fb9b42777ffd4b3aeaf17134a666c7f243c | tar -x -C "$baseline"
          cmp package-lock.json "$baseline/package-lock.json"
          # Same measurement code on both runtimes; no copied runtime fixes.
          for harness in performance-smoke.ts capacity-benchmark.ts worker-capacity-benchmark.ts performance-measurement.ts; do
            cp "scripts/$harness" "$baseline/scripts/$harness"
            sha256sum "scripts/$harness" >> "$out/harness-sha256.txt"
          done
          (cd "$baseline" && npm ci > "$out/baseline-npm-ci.log" 2>&1)
          failed=0
          for cohort in baseline candidate; do
            if [ "$cohort" = baseline ]; then directory="$baseline"; else directory="$GITHUB_WORKSPACE"; fi
            for kind in smoke capacity worker-capacity; do
              # Keep output inside the scripts' existing protected evidence root.
              # A failed cohort must not prevent collecting the other cohort.
              if (
                cd "$directory"
                export CAPACITY_OUTPUT="docs/evidence/performance/ci-$cohort-capacity.json"
                export WORKER_CAPACITY_OUTPUT="docs/evidence/performance/ci-$cohort-worker.json"
                if [ "$kind" = smoke ]; then harness=performance-smoke; else harness="$kind-benchmark"; fi
                node "$GITHUB_WORKSPACE/scripts/disposable-test.mjs" ./node_modules/.bin/tsx "scripts/$harness.ts" > "$out/$cohort-$kind.log" 2>&1
              ); then status=0; else status=$?; failed=1; fi
              printf '%s %s %s\n' "$cohort" "$kind" "$status" >> "$out/performance-exit-status.txt"
            done
            cp "$directory/docs/evidence/performance/ci-$cohort-"*.json "$out/" || failed=1
          done
          rm -rf "$baseline"
          test "$failed" = 0
      - run: npm run sbom
      - run: npm run license:report
      - if: always()
        run: docker compose -f infra/compose.yaml logs --no-color > ci-compose.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: cisme-r0-evidence, path: "ci-compose.log\ndocs/evidence/sbom.cdx.json\ndocs/evidence/LICENSE-REPORT.md\n${{ runner.temp }}/native-validation/"}
  candidate-design-qa:
    needs: verify
    if: ${{ needs.verify.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/candidate-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24.18.0', cache: npm}
      - run: npm ci
      - run: npm run miniprogram:package-gate
      - run: npm run design:qa:gate
  wechat-credentialed-preview:
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.event_name == 'workflow_dispatch' && vars.WECHAT_CI_RISK_ACCEPTED == 'true' }}
    runs-on: ubuntu-latest
    environment: wechat-preview
    timeout-minutes: 15
    env:
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24.18.0', cache: npm}
      - run: npm ci
      - run: npm ci --prefix tools/wechat-ci
      - name: Fail closed when protected credentials are unavailable
        run: test -n "$WECHAT_APP_ID" && test -n "$WECHAT_PRIVATE_KEY"
      - run: npm run typecheck
      - run: npm run miniprogram:package-gate
      - run: npm run design:qa:status
      - run: |
          key_path="$RUNNER_TEMP/wechat-private.key"
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          WECHAT_PRIVATE_KEY_PATH="$key_path" npm run wechat:ci:isolated
        env:
          WECHAT_CI_RISK_ACCEPTED: ${{ vars.WECHAT_CI_RISK_ACCEPTED }}
          WECHAT_PRIVACY_GUIDE_CONFIGURED: ${{ vars.WECHAT_PRIVACY_GUIDE_CONFIGURED }}
          WECHAT_LEGAL_TEXTS_APPROVED: ${{ vars.WECHAT_LEGAL_TEXTS_APPROVED }}
          WECHAT_SERVER_DOMAINS_CONFIGURED: ${{ vars.WECHAT_SERVER_DOMAINS_CONFIGURED }}
          WECHAT_DEMO_SCOPE_APPROVED: ${{ vars.WECHAT_DEMO_SCOPE_APPROVED }}
          WECHAT_EXPERIENCE_MEMBERS_CONFIGURED: ${{ vars.WECHAT_EXPERIENCE_MEMBERS_CONFIGURED }}
          WECHAT_TEST_TARGET_ISOLATED_VERIFIED: ${{ vars.WECHAT_TEST_TARGET_ISOLATED_VERIFIED }}
          WECHAT_TEST_PAYMENTS_DISABLED_VERIFIED: ${{ vars.WECHAT_TEST_PAYMENTS_DISABLED_VERIFIED }}
          WECHAT_TEST_PUBLIC_UGC_DISABLED_VERIFIED: ${{ vars.WECHAT_TEST_PUBLIC_UGC_DISABLED_VERIFIED }}
