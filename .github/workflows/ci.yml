name: CISME R0 gates
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24.18.0', cache: npm}
      - name: Diff hygiene
        run: git diff --check
      - name: Secret scan (Gitleaks 8.30.1, verified archive)
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --no-banner --no-color --redact=100
      - run: npm ci
      - run: docker compose -f infra/compose.yaml up -d --wait
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Development-tool critical audit
        run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm run miniprogram:package-gate
      - run: npm run design:qa:status
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run lint:contracts
      - run: npm run sbom
      - run: npm run license:report
      - if: always()
        run: docker compose -f infra/compose.yaml logs --no-color > ci-compose.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: cisme-r0-evidence, path: "ci-compose.log\ndocs/evidence/sbom.cdx.json\ndocs/evidence/LICENSE-REPORT.md"}
  candidate-design-qa:
    needs: verify
    if: ${{ needs.verify.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/candidate-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24.18.0', cache: npm}
      - run: npm ci
      - run: npm run miniprogram:package-gate
      - run: npm run design:qa:gate
  wechat-credentialed-preview:
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.event_name == 'workflow_dispatch' && vars.WECHAT_CI_RISK_ACCEPTED == 'true' }}
    runs-on: ubuntu-latest
    environment: wechat-preview
    timeout-minutes: 15
    env:
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24.18.0', cache: npm}
      - run: npm ci
      - run: npm ci --prefix tools/wechat-ci
      - name: Fail closed when protected credentials are unavailable
        run: test -n "$WECHAT_APP_ID" && test -n "$WECHAT_PRIVATE_KEY"
      - run: npm run typecheck
      - run: npm run design:qa:gate
      - run: |
          key_path="$RUNNER_TEMP/wechat-private.key"
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          WECHAT_PRIVATE_KEY_PATH="$key_path" npm run wechat:ci:isolated
        env:
          WECHAT_CI_RISK_ACCEPTED: ${{ vars.WECHAT_CI_RISK_ACCEPTED }}
          WECHAT_PRIVACY_GUIDE_CONFIGURED: ${{ vars.WECHAT_PRIVACY_GUIDE_CONFIGURED }}
          WECHAT_LEGAL_TEXTS_APPROVED: ${{ vars.WECHAT_LEGAL_TEXTS_APPROVED }}
          WECHAT_SERVER_DOMAINS_CONFIGURED: ${{ vars.WECHAT_SERVER_DOMAINS_CONFIGURED }}
          WECHAT_DEMO_SCOPE_APPROVED: ${{ vars.WECHAT_DEMO_SCOPE_APPROVED }}
