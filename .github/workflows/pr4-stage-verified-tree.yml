name: PR4 verified continuation objects
# Temporary transport only. Never changes a ref, merges, deploys, or accesses an environment.
# The authorised connector publishes the verified tree; this file is absent from that tree.
on:
  push:
    branches: [codex/native-perf-ux-repair-20260920]
    paths: [.github/workflows/pr4-stage-verified-tree.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'Eysn0130/cisme-wechat-miniapp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 3442d385d3aa64541c6ea8d486cf07147e7b0575
          fetch-depth: 1
          persist-credentials: false
      - name: Verify patch and stage immutable Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          BASE='3442d385d3aa64541c6ea8d486cf07147e7b0575'
          BASE_TREE='690d062621ef3fdd9bf321025df3863764c00bd5'
          TREE='e4d00301c1a37497c1a8a959854e2d74e53641e4'
          PATCH_SHA='7fc71224a1818dd0764fb8a0aa4c65fcbb20a5c8c40c05d83b7f89d0554f576c'
          CHUNKS=['016994012bde1ae636e02e5a36230c0f871f528c','cdb2d77f96afea06ccff237b0f78470fb61957e7','a7ebf836f8d15d514bf3d2d95ab8234da03ddbd8','d201413d2e5d6bee3e2f0b9f284dec6025e44bf2']
          API='https://api.github.com/repos/Eysn0130/cisme-wechat-miniapp/git/'
          def api(path, value=None):
              assert path.startswith(('blobs','trees')) and '..' not in path
              body=None if value is None else json.dumps(value).encode()
              req=urllib.request.Request(API+path,data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as res: return json.load(res)
          def git(*args): return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==BASE
          assert git('rev-parse','HEAD^{tree}').decode().strip()==BASE_TREE
          compressed=b''
          for sha in CHUNKS:
              obj=api('blobs/'+sha)
              content=base64.b64decode(obj['content'])
              assert hashlib.sha1(('blob '+str(len(content))+'\0').encode()+content).hexdigest()==sha
              compressed+=content
          patch=lzma.decompress(compressed,memlimit=256*1024*1024)
          assert len(patch)==143080 and hashlib.sha256(patch).hexdigest()==PATCH_SHA
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-continuation'
          out.mkdir()
          patch_path=out/'continuation.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch_path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert git('write-tree').decode().strip()==TREE
          entries=[]
          for name in git('diff','--cached','--name-only','-z').split(b'\0'):
              if not name: continue
              path=name.decode()
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              assert path.startswith(('.github/workflows/ci.yml','docs/','scripts/','services/','tests/'))
              raw=git('ls-files','--stage','-z','--',path).split(b'\0')[0]
              mode,sha,stage=raw.split(b'\t')[0].decode().split()
              assert stage=='0' and mode=='100644'
              content=git('cat-file','blob',sha)
              result=api('blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              assert result['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          result=api('trees',{'base_tree':BASE_TREE,'tree':entries})
          assert result['sha']==TREE
          report={'baseCommit':BASE,'baseTree':BASE_TREE,'targetTree':TREE,'patchSha256':PATCH_SHA,'entries':entries,'refUpdated':False,'releaseReady':False}
          (out/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'targetTree':TREE,'files':len(entries),'refUpdated':False}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr4-verified-continuation-tree
          path: ${{ runner.temp }}/verified-continuation
          retention-days: 3
          if-no-files-found: error
