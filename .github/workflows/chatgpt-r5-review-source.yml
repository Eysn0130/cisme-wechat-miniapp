name: CISME R5 bounded source review
on:
  pull_request:
    paths:
      - '.github/workflows/chatgpt-r5-review-source.yml'
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b4db47dc105d7f449a9822c49aed619384fce5c0
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Export tracked source and locked test dependencies only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r5-source"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = b4db47dc105d7f449a9822c49aed619384fce5c0
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          git bundle create "$out/source.bundle" HEAD
          git rev-parse HEAD > "$out/source-sha.txt"
          npm ci --ignore-scripts
          tar -czf "$out/test-dependencies.tar.gz" node_modules
          cp package-lock.json "$out/package-lock.json"
          (cd "$out" && sha256sum source.tar.gz source.bundle test-dependencies.tar.gz package-lock.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cisme-r5-source-b4db47d
          path: ${{ runner.temp }}/r5-source/
          retention-days: 3
