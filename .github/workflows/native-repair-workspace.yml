# One-time branch-scoped candidate transfer. Deletes itself before PR review.
name: Native repair apply
on:
  push:
    branches: [codex/native-perf-ux-repair-20260920]
    paths: [.github/workflows/native-repair-workspace.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/native-perf-ux-repair-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify ancestry and immutable candidate bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cc7a1033d0509d00fe7b6e32c1ad2af54ec6cbee
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = 56432fb9b42777ffd4b3aeaf17134a666c7f243c
          cat .native-repair-transfer/[0-9][0-9].part > "$RUNNER_TEMP/candidate.patch.xz"
          echo "2d5702dce93d0b65b5af229431e8d66240380d774ec8626a730c4d89ddd1baf9  $RUNNER_TEMP/candidate.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/candidate.patch.xz" > "$RUNNER_TEMP/candidate.patch"
          echo "15ce875f637efefc5a947b6bfe07e97f6cc41789eb3a0050d2ebd00e6f26c7df  $RUNNER_TEMP/candidate.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git rm -r .native-repair-transfer
          git rm .github/workflows/native-repair-workspace.yml
          git diff --cached --check
          test "$(git write-tree)" = 7a45f757e9ab97c15163819b5ae940bd1fd35d0f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(native): progressive critical views, recoverable care writes and bounded dependency work' -m 'Repair PERF-01 through PERF-10 with source-level regressions, per-route metrics, real SDK cancellation tests, PostgreSQL fault tests and reproducible evidence. Keep releaseReady false; native device and staging gates remain pending. Remove one-time transfer workflow and payload.'
      - name: Push only this task branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/native-perf-ux-repair-20260920
          unset auth
          out="$RUNNER_TEMP/native-repair-candidate"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/HEAD.txt"
          git rev-parse HEAD^{tree} > "$out/TREE.txt"
          git bundle create "$out/candidate.bundle" HEAD
          sha256sum "$out/candidate.bundle" > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-repair-candidate
          path: ${{ runner.temp }}/native-repair-candidate/
          retention-days: 3
          if-no-files-found: error
