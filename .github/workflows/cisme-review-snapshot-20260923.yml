name: CISME bounded source repair verification (temporary)
on:
  push:
    branches: [codex/fulfillment-lifecycle-20260922]
    paths:
      - .github/workflows/cisme-review-snapshot-20260923.yml
      - .github/cisme-review-apply.py
      - .github/cisme-review-materials/**
permissions:
  contents: write
concurrency:
  group: cisme-bounded-source-repair
  cancel-in-progress: false
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.18.0', cache: npm}
      - name: Verify preimages, apply scoped repairs, and bind honest evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cisme-repair-evidence"
          python3 - <<'PY'
          import hashlib,json,os,runpy
          from pathlib import Path
          bounds=json.loads(Path('.github/cisme-review-materials/bounds.json').read_text())
          def verify(section):
           for path,digest in bounds[section].items():
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          verify('before')
          for path in set(bounds['after'])-set(bounds['before']):assert not Path(path).exists(),path
          runpy.run_path('.github/cisme-review-apply.py')
          runpy.run_path('.github/cisme-review-materials/compat.py')
          verify('after')
          manifest=Path('docs/evidence/visual/current-source-acceptance.json')
          original=manifest.read_bytes();data=json.loads(original)
          assert data['packageSourceSha256']=='96bcfbef0b01811aa7474813bc880d9cda8f0220f3c1324b03dfe29e1461ef1d'
          assert data['finalResult']=='blocked' and not data['evidenceIndex']
          archive=manifest.with_name('source-acceptance-96bcfbef-before-sheet-repair.json')
          assert not archive.exists();archive.write_bytes(original)
          root=Path('apps/miniprogram');digest=hashlib.sha256()
          # Sort complete POSIX paths, matching JavaScript Array.sort in the existing package inspector.
          for path in sorted(root.rglob('*'),key=str):
           if path.is_file() and not str(path).endswith('project.private.config.json'):
            digest.update(str(path.relative_to(root)).encode());digest.update(b'\0');digest.update(path.read_bytes())
          assert digest.hexdigest()==bounds['packageSourceSha256']
          data['packageSourceSha256']=digest.hexdigest()
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          Path(os.environ['RUNNER_TEMP'],'cisme-repair-evidence','source-hashes.json').write_text(json.dumps({'files':bounds['after'],'packageSourceSha256':digest.hexdigest(),'nativeDeviceValidated':False},indent=2)+'\n')
          PY
          git diff --check
      - name: Install exact locked dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/cisme-repair-evidence/npm-ci.log"
      - name: Typecheck and actual unit suite
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/cisme-repair-evidence/typecheck.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/cisme-repair-evidence/unit.log"
          npm run miniprogram:package-gate 2>&1 | tee "$RUNNER_TEMP/cisme-repair-evidence/package.log"
          npm run miniprogram:route-audit 2>&1 | tee "$RUNNER_TEMP/cisme-repair-evidence/routes.log"
          npm run design:qa:status 2>&1 | tee "$RUNNER_TEMP/cisme-repair-evidence/design-status.log"
      - name: Commit only verified changes and fast-forward original branch
        run: |
          set -euo pipefail
          branch='codex/fulfillment-lifecycle-20260922'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git add apps/miniprogram/pages/order-detail/index.ts apps/miniprogram/pages/order-detail/index.wxml apps/miniprogram/pages/order-detail/index.wxss apps/miniprogram/services/commerce-runtime.ts tests/unit/native-order-support-sheet.test.ts tests/unit/native-runtime-projection-contract.test.ts tests/unit/native-boundaries.test.ts docs/evidence/visual/current-source-acceptance.json docs/evidence/visual/source-acceptance-96bcfbef-before-sheet-repair.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git -c user.name='CISME source review' -c user.email='103180203+Eysn0130@users.noreply.github.com' commit -m 'fix(native): preserve aftersale sheet continuity and simplify customer actions'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/cisme-repair-evidence/result-identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cisme-scoped-repair-verification
          path: ${{ runner.temp }}/cisme-repair-evidence/
          retention-days: 3
