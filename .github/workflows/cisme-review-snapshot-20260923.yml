name: CISME requested source review snapshot (temporary)
on:
  push:
    branches: [codex/fulfillment-lifecycle-20260922]
    paths: [.github/workflows/cisme-review-snapshot-20260923.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 3c2f99496d2bee972269165702b3313814a98a5c
          persist-credentials: false
      - name: Archive only the explicitly reviewed committed source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cisme-requested-review"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = '3c2f99496d2bee972269165702b3313814a98a5c'
          git rev-parse HEAD HEAD^{tree} > "$out/checkout-identity.txt"
          git archive --format=tar HEAD | gzip -n > "$out/committed-source.tar.gz"
          (cd "$out" && sha256sum committed-source.tar.gz > committed-source.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cisme-requested-review-3c2f994
          path: ${{ runner.temp }}/cisme-requested-review/
          retention-days: 3
