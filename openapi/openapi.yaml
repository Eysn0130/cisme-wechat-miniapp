openapi: 3.1.0
info:
  title: CISME R0 Platform API
  version: 0.1.0
  description: Authoritative API for the first production vertical slice. Transaction profile remains UNSET.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; production domain is an external blocker.
tags:
  - name: Identity
  - name: Care
  - name: Submission
  - name: Admin
  - name: Read models
  - name: Attribution
  - name: Authority
  - name: Support
paths:
  /v1/capabilities:
    get:
      operationId: runtimeCapabilities
      security: []
      description: Cheap public feature projection; performs no database or object-storage readiness probe and contains no member data.
      responses: {'200': {description: Versioned public runtime capabilities}}
  /v1/bootstrap/home:
    get: {tags: [Read models], operationId: bootstrapHome, security: [{session: []}], responses: {'200': {description: One repeatable-read member and care home snapshot with asOf and businessVersion}}}
  /v1/bootstrap/profile:
    get: {tags: [Read models], operationId: bootstrapProfile, security: [{session: []}], responses: {'200': {description: One repeatable-read member, care and points snapshot with asOf and businessVersion}}}
  /v1/bootstrap/settings:
    get: {tags: [Read models], operationId: bootstrapSettings, security: [{session: []}], responses: {'200': {description: One repeatable-read member, phone and consent snapshot with asOf and businessVersion}}}
  /v1/identity/capabilities:
    get:
      operationId: identityCapabilities
      security: []
      description: Public runtime switches for the native login button. Contains no credentials or member data. Phone true means server configuration is enabled, not proof of successful end-user authorization.
      responses:
        '200':
          description: Native login capabilities
          content:
            application/json:
              schema:
                type: object
                required: [phoneBindingEnabled, avatarSelection]
                properties:
                  phoneBindingEnabled: {type: boolean}
                  avatarSelection: {type: string, enum: [chooseAvatar]}
  /v1/me/privacy-requests:
    get:
      operationId: listMyPrivacyRequests
      security: [{session: []}]
      responses: {'200': {description: Last 100 requests belonging only to the current member}}
    post:
      operationId: submitPrivacyRequest
      security: [{session: []}]
      description: Registers access, correct, delete, close_account, withdraw or other request; deduplicates identical unanswered requests and limits to 10 per day. Does not execute deletion or account closure.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [kind, message], properties: {kind: {type: string, enum: [access, correct, delete, close_account, withdraw, other]}, message: {type: string, minLength: 1, maxLength: 2000}}}}}
      responses: {'200': {description: Received request id and status}, '422': {description: Invalid input}, '429': {description: Daily limit}}
  /v1/admin/privacy-requests:
    get:
      operationId: privacyRequestQueue
      description: Requires admin token, principal, and support or review_lead role.
      security: [{adminToken: [], adminPrincipal: []}]
      responses: {'200': {description: Requests with pending first}, '403': {description: Missing operator role}}
  /v1/admin/privacy-requests/{requestId}/response:
    post:
      operationId: respondPrivacyRequest
      description: Requires admin token and support or review_lead role. Saves an auditable member-visible reply, not an automatic data operation.
      security: [{adminToken: [], adminPrincipal: []}]
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [status, response, expectedVersion], properties: {status: {type: string, enum: [reviewing, responded]}, response: {type: string, minLength: 1, maxLength: 4000}, expectedVersion: {type: integer, minimum: 1}}}}}
      responses: {'200': {description: Version-guarded saved response; never proof of execution}, '409': {description: Request changed or closed}, '403': {description: Missing operator role}, '404': {description: Request not found}}
  /v1/admin/privacy-requests/{requestId}/execution-plan:
    post:
      operationId: planPrivacyRequestExecution
      description: Review-lead-only, idempotent creation of one plan-only export job or dry-run erasure job. Does not read an export archive, delete data, close an account, approve a job, or run a job.
      security: [{adminToken: [], adminPrincipal: []}]
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expectedVersion, reasonCode], properties: {expectedVersion: {type: integer, minimum: 1}, reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$'}}}}}
      responses: {'200': {description: Non-executing plan created or exact idempotent replay}, '409': {description: Stale, closed, already planned, or manual-only request}, '403': {description: Missing review_lead role}, '404': {description: Request not found}}
  /v1/legal:
    get:
      operationId: currentLegalDocuments
      description: Public full text and versions of active terms/privacy and optional separate cross_border notice; ready only when both exist. Never records acceptance.
      responses: {'200': {description: Current published documents and ready flag}}
  /v1/me/profile:
    get:
      operationId: readOwnMemberProfile
      security: [{session: []}]
      description: Own nickname, small canonical JPEG avatar, optional private WeChat handle, revision and community display review status. No other member contact details.
      responses: {'200': {description: Own profile}, '401': {description: Active member session required}}
    put:
      operationId: updateOwnMemberProfile
      security: [{session: []}]
      description: Updates only the current member. expectedVersion prevents stale edits; omitted only for legacy clients. Omitted avatar/handle/visibility preserve existing data. Null avatar removes it. Community identity is private unless explicitly requested and independently approved; nickname/avatar changes withdraw prior approval. Login never rewrites this profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 40}
                wechatHandle: {type: string, maxLength: 20}
                avatarDataUrl: {type: [string, 'null'], maxLength: 100000, description: JPEG data URI only; decoded with dimension/memory limits and re-encoded as a 128-pixel thumbnail. External and temporary URLs are rejected.}
                communityVisible: {type: boolean}
                expectedVersion: {type: integer, minimum: 0}
      responses: {'200': {description: Saved own profile with incremented revision}, '409': {description: Profile changed; reload before retry}, '422': {description: Invalid nickname or avatar}}
  /v1/team/member-profiles:
    get:
      operationId: pendingCommunityProfiles
      security: [{session: []}]
      description: Verified team members only; up to 50 pending public nickname/avatar requests. Excludes private contact information.
      responses: {'200': {description: Pending profiles}, '403': {description: Team access required}}
  /v1/team/member-profiles/{memberId}/review:
    post:
      operationId: reviewCommunityProfile
      security: [{session: []}]
      description: Requires independent team reviewer and the current revision; self-review, stale decisions and approval after withdrawal are rejected.
      parameters: [{name: memberId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision, expectedVersion, reason], properties: {decision: {type: string, enum: [approve, reject]}, expectedVersion: {type: integer, minimum: 0}, reason: {type: string, minLength: 2, maxLength: 200}}}}}
      responses: {'200': {description: Audited review}, '403': {description: Independent team reviewer required}, '409': {description: Profile or review changed}}
  /v1/me/phone:
    get:
      operationId: phoneBindingStatus
      security: [{session: []}]
      responses: {'200': {description: Only the caller masked phone and binding capability}}
    delete:
      operationId: unbindOwnPhone
      security: [{session: []}]
      description: Deletes the current member encrypted phone and blind index without changing their identity, care records or profile. Keeps only prior code-consumption and action audit evidence. Does not require the phone capability to be enabled.
      responses: {'200': {description: Unbound, idempotently}, '401': {description: Active member required}}
    post:
      operationId: bindWechatPhone
      security: [{session: []}]
      description: Exchanges a user-triggered one-time WeChat phone code, verifies app watermark, encrypts storage and uses a HMAC blind index. No automatic account merge or registration reward.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, minLength: 1, maxLength: 512}}}}}
      responses: {'200': {description: Bound and masked number}, '409': {description: Code consumed by another member or phone already bound}, '503': {description: Binding service unavailable}}
  /v1/me/community-access:
    get:
      operationId: communityCapabilities
      security: [{session: []}]
      responses: {'200': {description: Current environment-scoped community.moderate capability and canReview flag; legacy team rows do not authorize}}
  /v1/me/follows:
    get:
      operationId: followedAuthors
      security: [{session: []}]
      responses: {'200': {description: Caller followed author IDs}}
  /v1/me/following:
    get:
      operationId: followingFeed
      security: [{session: []}]
      responses: {'200': {description: Latest published content by followed authors; publication gate remains enforced}}
  /v1/me/following/page:
    get:
      operationId: followingFeedPage
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageLimit'}]
      responses: {'200': {description: Repeatable-read stable cursor page with de-duplicated public author projection}}
  /v1/me/follows/{authorId}:
    parameters: [{name: authorId, in: path, required: true, schema: {type: string}}]
    put:
      operationId: setFollow
      security: [{session: []}]
      description: Sets desired state idempotently; author must be CISME editorial or an author of published content.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [active], properties: {active: {type: boolean}}}}}
      responses: {'200': {description: Saved following state}, '422': {description: Invalid state or self follow}}
  /v1/team/reviews:
    get:
      operationId: nativeReviewQueue
      security: [{session: []}]
      description: Requires current database team membership and review role; client role headers are ignored.
      responses: {'200': {description: Pending submissions}, '403': {description: Team access denied}}
  /v1/team/publications:
    get:
      operationId: nativePublicationQueue
      security: [{session: []}]
      responses: {'200': {description: Approved submissions awaiting publication review}, '403': {description: Team access denied}}
  /v1/team/submissions/{submissionId}/review:
    parameters: [{name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: nativeReviewSubmission
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Same versioned evidence review as admin endpoint; only approve, reject or request_changes are accepted.
      responses: {'200': {description: Reviewed state}, '403': {description: Team access denied}, '409': {description: Version or state conflict}}
  /v1/team/submissions/{submissionId}/publish:
    parameters: [{name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: nativePublishSubmission
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Requires another review lead, active public-display consent, UGC gate and publication title/excerpt/AI declaration/evidence. Queues an audited publication event.
      responses: {'200': {description: Publication queued or already published}, '403': {description: Team access denied}, '409': {description: Four-eyes or consent conflict}, '503': {description: Publication gate closed}}
  /v1/uploads/{mediaId}/chunks:
    parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: cloudUploadChunk
      description: Signed short-lived upload token required in body. Sequential 512 KiB base64 chunks, total at most 10 MiB. Replays must contain identical bytes. No final object is exposed to client writes.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token, index, totalBytes, base64], properties: {token: {type: string}, index: {type: integer, minimum: 0, maximum: 19}, totalBytes: {type: integer, minimum: 1, maximum: 10485760}, base64: {type: string, maxLength: 699052}}}}}
      responses: {'200': {description: Chunk durably received}, '401': {description: Invalid or expired token}, '409': {description: Conflict or wrong order}}
  /v1/uploads/{mediaId}/assemble:
    parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: assembleCloudUpload
      description: Requires all chunks and same signed token; reuses submission/media locks and gateway validation. Member must still call existing media completion to verify and commit current evidence.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}}}}}
      responses: {'200': {description: Object written awaiting completion}, '409': {description: Incomplete or locked upload}}
  /health/live:
    get: {operationId: live, responses: {'200': {description: Process live}}}
  /health/ready:
    get: {operationId: ready, responses: {'200': {description: Database and object storage ready}}}
  /v1/identity/dev:
    post:
      tags: [Identity]
      operationId: devIdentity
      description: Development adapter only; forbidden in staging and production.
      requestBody: {$ref: '#/components/requestBodies/Identity'}
      responses: {'200': {$ref: '#/components/responses/Identity'}, '503': {$ref: '#/components/responses/Problem'}}
  /v1/identity/wechat:
    post:
      tags: [Identity]
      operationId: wechatIdentity
      requestBody: {$ref: '#/components/requestBodies/Identity'}
      responses: {'200': {$ref: '#/components/responses/Identity'}, '502': {$ref: '#/components/responses/Problem'}}
  /v1/qualifications/dev:
    post:
      tags: [Care]
      operationId: devQualification
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [externalRef, occurredAt], properties: {externalRef: {type: string}, occurredAt: {type: string, format: date-time}, payload: {type: object}}}}}}
      responses: {'200': {description: Idempotent qualification fact, content: {application/json: {schema: {$ref: '#/components/schemas/Id'}}}}, '503': {$ref: '#/components/responses/Problem'}}
  /v1/care-cycles:
    post:
      tags: [Care]
      operationId: planCareCycle
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [qualificationFactId, timezone, protocolVersion], properties: {qualificationFactId: {$ref: '#/components/schemas/Uuid'}, timezone: {type: string}, protocolVersion: {type: string}}}}}}
      responses: {'200': {$ref: '#/components/responses/Care'}, '409': {$ref: '#/components/responses/Problem'}}
  /v1/me/care:
    get: {tags: [Care], operationId: getCare, security: [{session: []}], responses: {'200': {$ref: '#/components/responses/Care'}}}
  /v1/me/addresses:
    get:
      tags: [Member]
      operationId: listDeliveryAddresses
      security: [{session: []}]
      responses: {'200': {description: Member-owned encrypted delivery-address book, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAddressList'}}}}}
    post:
      tags: [Member]
      operationId: createDeliveryAddress
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAddressInput'}}}}
      responses: {'200': {description: Address saved without creating an order, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAddress'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/me/addresses/{addressId}:
    parameters: [{$ref: '#/components/parameters/AddressId'}]
    put:
      tags: [Member]
      operationId: updateDeliveryAddress
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAddressUpdateInput'}}}}
      responses: {'200': {description: Versioned address update, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAddress'}}}}, '409': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Member]
      operationId: deleteDeliveryAddress
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Address soft-deleted; another saved address becomes default when needed}, '409': {$ref: '#/components/responses/Problem'}}
  /v1/me/addresses/{addressId}/default:
    post:
      tags: [Member]
      operationId: setDefaultDeliveryAddress
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/AddressId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Address selected as the member default}, '409': {$ref: '#/components/responses/Problem'}}
  /v1/care-cycles/{cycleId}/activate:
    post:
      tags: [Care]
      operationId: activateCareCycle
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CycleId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CareVersionCommandInput'}}}}
      responses: {'200': {description: Versioned activation or exact command replay, content: {application/json: {schema: {$ref: '#/components/schemas/CareView'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/care-cycles/{cycleId}/{action}:
    post:
      tags: [Care]
      operationId: changeCarePhase
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CycleId'}, {name: action, in: path, required: true, schema: {type: string, enum: [pause, resume, terminate]}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reasonCode, expectedVersion], properties: {reasonCode: {type: string, minLength: 1}, expectedVersion: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Versioned state transition or exact replay}, '409': {$ref: '#/components/responses/Problem'}}
  /v1/care-cycles/{cycleId}/milestones/{milestone}/complete:
    post:
      tags: [Care]
      operationId: completeCareMilestone
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CycleId'}, {name: milestone, in: path, required: true, schema: {$ref: '#/components/schemas/Milestone'}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CareMilestoneCommandInput'}}}}
      responses: {'200': {description: Versioned milestone record and optional task, or exact command replay}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/me/tasks:
    get: {tags: [Read models], operationId: getEligibleTasks, security: [{session: []}], responses: {'200': {description: Member-owned effective invitations}}}
  /v1/tasks/{taskId}:
    get: {tags: [Read models], operationId: getTask, security: [{session: []}], parameters: [{$ref: '#/components/parameters/TaskId'}], responses: {'200': {description: Member-owned task}, '404': {$ref: '#/components/responses/Problem'}}}
  /v1/tasks/{taskId}/claim:
    post:
      tags: [Submission]
      operationId: claimTask
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Same claim and submission for every replay}, '409': {$ref: '#/components/responses/Problem'}}
  /v1/submissions/{submissionId}/media/authorize:
    post:
      tags: [Submission]
      operationId: authorizeMedia
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind, mimeType], properties: {kind: {type: string, enum: [original, screenshot]}, mimeType: {type: string}, maxBytes: {type: integer, maximum: 10485760}}}}}}
      responses: {'200': {description: Controlled gateway POST or feature-gated 10-minute single-object COS PUT authorization; completion always revalidates bytes, type and hash}, '503': {$ref: '#/components/responses/Problem'}}
  /v1/uploads/{mediaId}:
    post:
      tags: [Submission]
      operationId: gatewayUpload
      description: Local fallback adapter; production storage remains supplier-dependent.
      parameters: [{name: mediaId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [token, file], properties: {token: {type: string}, file: {type: string, format: binary}}}}}}
      responses: {'200': {description: Object persisted}, '401': {$ref: '#/components/responses/Problem'}}
  /v1/submissions/{submissionId}/media/{mediaId}/complete:
    post:
      tags: [Submission]
      operationId: completeMedia
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionId'}, {name: mediaId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}]
      responses: {'200': {description: HEAD and checksum recorded}, '409': {$ref: '#/components/responses/Problem'}}
  /v1/submissions/{submissionId}/media/{mediaId}:
    delete:
      tags: [Submission]
      operationId: deleteMedia
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionId'}, {name: mediaId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}]
      responses: {'200': {description: Media is removed from the active read model and durable object cleanup is queued}}
  /v1/submissions/{submissionId}/draft:
    put:
      tags: [Submission]
      operationId: saveSubmissionDraft
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmissionInput'}}}}
      responses: {'200': {description: Versioned server-side draft saved}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/submissions/{submissionId}/submit:
    post:
      tags: [Submission]
      operationId: submitEvidence
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmissionInput'}}}}
      responses: {'200': {description: Submitted or exact replay}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/submissions/{submissionId}:
    get: {tags: [Read models], operationId: getSubmission, security: [{session: []}], parameters: [{$ref: '#/components/parameters/SubmissionId'}], responses: {'200': {description: Object-owned submission view including authoritative media_uploads_enabled kill-switch state}, '404': {$ref: '#/components/responses/Problem'}}}
  /v1/submissions/{submissionId}/appeal:
    post: {tags: [Submission], operationId: appeal, security: [{session: []}], parameters: [{$ref: '#/components/parameters/SubmissionId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {description: Versioned appeal created or exact replay}, '409': {$ref: '#/components/responses/Problem'}}}
  /v1/admin/reviews:
    get: {tags: [Admin], operationId: reviewQueue, security: [{adminToken: [], adminPrincipal: []}], responses: {'200': {description: RBAC-filtered queue}, '403': {$ref: '#/components/responses/Problem'}}}
  /v1/admin/tester-enrollments:
    post:
      tags: [Admin]
      operationId: qualifyExperienceMember
      description: Audited experience-member bridge when no transaction profile exists. A review lead or support principal records verified delivery or approved tester fulfillment and atomically creates one PLANNED care cycle. It is not a production order substitute.
      security: [{adminToken: [], adminPrincipal: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TesterEnrollmentInput'}}}}
      responses: {'200': {description: Idempotent qualification fact and planned care cycle}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/admin/campaigns:
    get:
      tags: [Admin]
      operationId: listEligibilityCampaigns
      description: Versioned campaign configuration with effective allocation counts. Review lead, auditor or support only.
      security: [{adminToken: [], adminPrincipal: []}]
      responses: {'200': {description: Campaign configuration and current allocation facts}, '403': {$ref: '#/components/responses/Problem'}}
  /v1/admin/campaigns/{campaignId}:
    put:
      tags: [Admin]
      operationId: updateEligibilityCampaign
      description: Review-lead-only, evidence-bearing update of campaign availability, window and capacity. Reward amount and qualifying milestone remain immutable finance/product facts.
      security: [{adminToken: [], adminPrincipal: []}]
      parameters: [{name: campaignId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [active, capacity, startsAt, endsAt, expectedVersion, reasonCode, evidence], properties: {active: {type: boolean}, capacity: {type: integer, minimum: 1, maximum: 100000}, startsAt: {type: string, format: date-time}, endsAt: {type: string, format: date-time}, expectedVersion: {type: integer, minimum: 1}, reasonCode: {type: string, minLength: 1}, evidence: {type: object, minProperties: 1}}}}}}
      responses: {'200': {description: Versioned audited update or exact replay}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/admin/submissions/{submissionId}/review:
    post:
      tags: [Admin]
      operationId: reviewSubmission
      security: [{adminToken: [], adminPrincipal: []}]
