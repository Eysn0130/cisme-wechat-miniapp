      operationId: listManagedAftersales
      summary: Capability scoped after-sale queue
      security: [{session: []}]
      parameters:
        - {in: query, name: orderId, schema: {$ref: '#/components/schemas/Uuid'}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 600}}
