        - {in: query, name: orderId, schema: {$ref: '#/components/schemas/Uuid'}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 600}}
      responses:
        '200': {description: Local case facts; channel refund success is a separate verified fact}
        '401': {description: Session required}
        '403': {description: Active member and current capability required}
        '404': {description: Owned case or order not found}
        '409': {description: State, version or idempotency conflict}
        '422': {description: Invalid bounded input}
        '503': {description: Money authorization unavailable}
  /v1/me/aftersales/{caseId}:
    get:
      operationId: myAftersale
      summary: Owner scoped case and bounded history
      description: Includes immutable case-specific return instruction versions so the owner can identify the version actually used for shipment. The shipped version is preserved separately from the current instruction.
      security: [{session: []}]
      parameters:
        - {in: path, name: caseId, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {description: Local case facts; channel refund success is a separate verified fact}
        '401': {description: Session required}
        '403': {description: Active member and current capability required}
        '404': {description: Owned case or order not found}
        '409': {description: State, version or idempotency conflict}
        '422': {description: Invalid bounded input}
        '503': {description: Return destination or money authorization unavailable}
  /v1/me/aftersales/{caseId}/actions:
    post:
      operationId: actMyAftersale
      summary: Withdraw, supplement or register return waybill
      description: report_old_route records that a buyer has already shipped to an earlier valid address before receiving a waybill; it does not invent a tracking number or withdraw the application. For ship_return, instructionVersion identifies the actual issued version followed by the buyer. Older valid versions are accepted, retained as shipment evidence and queued for human route review. Later waybill registration must keep the same version. Legacy clients omitting it use the recorded or current version; new native clients send it explicitly.
      security: [{session: []}]
      parameters:
        - {in: path, name: caseId, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [action, expectedVersion, note], properties: {action: {type: string, enum: [cancel, provide_info, report_old_route, ship_return]}, expectedVersion: {type: integer, minimum: 1}, note: {type: string, minLength: 3, maxLength: 500}, carrier: {type: string, maxLength: 80}, tracking: {type: string, pattern: '^[A-Za-z0-9-]{6,64}$'}, instructionVersion: {type: integer, minimum: 1}}}}}}
      responses:
        '200': {description: Local case facts; channel refund success is a separate verified fact}
        '401': {description: Session required}
        '403': {description: Active member and current capability required}
        '404': {description: Owned case or order not found}
        '409': {description: State, version or idempotency conflict}
        '422': {description: Invalid bounded input}
        '503': {description: Return destination or money authorization unavailable}
  /v1/management/aftersales:
