openapi: 3.1.0
info:
  title: CISME R0 Platform API
  version: 0.1.0
  description: Authoritative API for the first production vertical slice. Transaction profile remains UNSET.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; production domain is an external blocker.
tags:
  - name: Identity
  - name: Care
  - name: Submission
  - name: Admin
  - name: Read models
  - name: Attribution
  - name: Authority
  - name: Support
paths:
  /v1/me/commerce/command-receipts/{kind}:
    get:
      operationId: getOwnCommerceCommandReceipt
      summary: Query a minimal owner-scoped durable command receipt without enabling money operations
      description: >-
        Reads existing local business records, independent of provider availability.
        The Idempotency-Key header is required but never echoed. A not_observed result
        is not proof of failure or permission to create a new command: an earlier
        transaction can still be in flight. Only the original key and normalized
        payload may be retried under each command's unchanged server-side gates.
        No payment/transfer package, recipient identity or free-text reason is returned.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [refund, settlement, credit, credit-cancel, cancel, cancel-verified]
        - in: query
          name: objectId
          description: Required for refund and cancellation kinds; disallowed for settlement and credit
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authoritative minimal receipt, or explicitly inconclusive not_observed
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, memberId, kind, status, record]
                properties:
                  version: {type: integer, const: 1}
                  memberId: {type: string, format: uuid}
                  kind:
                    type: string
                    enum: [refund, settlement, credit, credit-cancel, cancel, cancel-verified]
                  status: {type: string, enum: [recorded, not_observed]}
                  record:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required: [id, state]
                        properties:
                          id: {type: string, format: uuid}
                          state: {type: string}
                          orderId: {type: string, format: uuid}
                          amountCents: {type: integer}
        '400':
          description: Missing idempotency key
        '401':
          description: Missing, invalid or revoked identity
        '422':
          description: Invalid kind, key or object scope; unsupported query fields
  /v1/me/commerce/recorded-commands/{kind}:
    get:
      operationId: discoverOwnRecordedCommerceCommands
      summary: Discover retained owned command facts after local key loss
      description: >-
        Reads existing records without an original key, independently of Provider availability.
        This is read-only discovery, not replay, unlock, proof of funds, or permission to retry.
        Absence is inconclusive and only retained records are covered; no retention policy changes.
        No original keys, request payloads, amounts, payees, confirmation packages, or internal responses are exposed.
        Cancellation kinds are aliases of the same recorded order-cancellation fact, not proof of which UI initiated it.
        Cursors bind environment, principal, member, kind and optional object; each page rechecks ownership.
        States and recordVersion describe the current domain record. Unversioned conversions return null.
      security:
        - session: []
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [refund, settlement, credit, credit-cancel, cancel, cancel-verified]
        - in: query
          name: objectId
          description: Optional order ID for refund/order cancellation, settlement ID for settlement, conversion ID for credit kinds
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 30}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 600}
      responses:
        '200':
          description: Bounded recorded facts; an empty page never proves failure
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, kind, coverage, absenceIsFailure, items, loadedCount, hasMore, nextCursor]
                properties:
                  version: {type: integer, const: 1}
                  kind: {type: string, enum: [refund, settlement, credit, credit-cancel, cancel, cancel-verified]}
                  coverage: {type: string, const: retained_recorded_facts_only}
                  absenceIsFailure: {type: boolean, const: false}
                  loadedCount: {type: integer, minimum: 0, maximum: 50}
                  hasMore: {type: boolean}
                  nextCursor: {type: [string, 'null']}
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, objectId, state, recordVersion, commandCreatedAt]
                      properties:
                        id: {type: string, format: uuid}
                        objectId: {type: string, format: uuid}
                        state: {type: string}
                        recordVersion: {type: [integer, 'null'], minimum: 1}
                        commandCreatedAt: {type: string, format: date-time}
        '401':
          description: Missing, invalid, expired or revoked identity
        '422':
          description: Invalid kind/object/page/cursor or unsupported query fields
  /v1/capabilities:
    get:
      operationId: runtimeCapabilities
      security: []
      description: Cheap public feature projection; performs no database or object-storage readiness probe and contains no member data.
      responses: {'200': {description: Versioned public runtime capabilities}}
  /v1/bootstrap/home:
    get: {tags: [Read models], operationId: bootstrapHome, security: [{session: []}], responses: {'200': {description: One repeatable-read member and care home snapshot with asOf and businessVersion}}}
  /v1/bootstrap/profile:
    get: {tags: [Read models], operationId: bootstrapProfile, security: [{session: []}], responses: {'200': {description: One repeatable-read member, care and points snapshot with asOf and businessVersion}}}
  /v1/bootstrap/settings:
    get: {tags: [Read models], operationId: bootstrapSettings, security: [{session: []}], responses: {'200': {description: One repeatable-read member, phone and consent snapshot with asOf and businessVersion}}}
  /v1/identity/capabilities:
    get:
      operationId: identityCapabilities
      security: []
      description: Public runtime switches for the native login button. Contains no credentials or member data. Phone true means server configuration is enabled, not proof of successful end-user authorization.
      responses:
        '200':
          description: Native login capabilities
          content:
            application/json:
              schema:
                type: object
                required: [phoneBindingEnabled, avatarSelection]
                properties:
                  phoneBindingEnabled: {type: boolean}
                  avatarSelection: {type: string, enum: [chooseAvatar]}
  /v1/me/privacy-requests:
    get:
      operationId: listMyPrivacyRequests
      security: [{session: []}]
      description: Without page, preserves the legacy array of up to 100 own records. With page=1, returns items (up to 30) and nextCursor; pass the opaque cursor to reach older records. A refreshed first page starts a new traversal.
      parameters: [{name: page, in: query, schema: {type: string, enum: ['1']}}, {name: cursor, in: query, schema: {type: string, maxLength: 512}}]
      responses: {'200': {description: Own records; paged object when page=1, otherwise legacy array}, '422': {description: Invalid page or cursor}}
    post:
      operationId: submitPrivacyRequest
      security: [{session: []}]
      description: Registers access, correct, delete, close_account, withdraw or other request; deduplicates identical open requests and limits to 10 per day. Optional scopeCode is test-only for a dev_test identity and the profile-handle deletion class; unscoped requests never authorize automatic erasure. Submission alone does not execute deletion or account closure.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [kind, message], properties: {kind: {type: string, enum: [access, correct, delete, close_account, withdraw, other]}, message: {type: string, minLength: 1, maxLength: 2000}, scopeCode: {type: string, enum: [member_profile_handle_v1]}}}}}
      responses: {'200': {description: Received request id and status}, '422': {description: Invalid input}, '429': {description: Daily limit}}
  /v1/me/privacy-requests/{requestId}/reply:
    post:
      operationId: replyToOwnPrivacyRequest
      description: An authenticated owner may supplement a request only after an operator explicitly asks for information. The original request and every supplement remain separate immutable facts. Exact idempotent replay returns the original receipt; a fresh reply returns the request to the operator queue.
      security: [{session: []}]
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [message, expectedVersion], properties: {message: {type: string, minLength: 1, maxLength: 2000}, expectedVersion: {type: integer, minimum: 1}}}}}
      responses: {'200': {description: Supplement recorded and returned to operator}, '403': {description: Member inactive}, '404': {description: Request not owned}, '409': {description: Stale version, no supplement requested or idempotency conflict}, '422': {description: Invalid input}}
  /v1/management/attention:
    get:
      operationId: managementAttentionSummary
      summary: Capability filtered management work counts
      description: Read-only counts for existing support, after-sale, old-address shipment review, refund and privacy workspaces. Holds current member grants through the database read and returns no personal details. A count is a navigation aid, not a case decision or external notification.
      security: [{session: []}]
      responses:
        '200': {description: Versioned counts for currently granted workspaces}
        '401': {description: Member session required}
        '403': {description: No active management capability}
  /v1/management/privacy-requests:
    get:
      operationId: nativePrivacyRequestQueue
      description: Native management queue. Requires an active signed member session and current environment-bound privacy.request.manage capability; legacy operator roles cannot replace this capability. Locks authority for each page read. Without page, preserves the legacy array of up to 100 records; page=1 returns items (up to 30) and nextCursor. No export payload is returned.
      security: [{session: []}]
      parameters: [{name: page, in: query, schema: {type: string, enum: ['1']}}, {name: cursor, in: query, schema: {type: string, maxLength: 512}}]
      responses: {'200': {description: Requests ordered by open status and due date}, '401': {description: Member session required}, '403': {description: Capability unavailable or revoked}, '422': {description: Invalid page or cursor}}
  /v1/management/privacy-requests/{requestId}/response:
    post:
      operationId: nativeRespondPrivacyRequest
      description: Requires current privacy.request.manage capability from the signed member. Rechecks and locks authority after locking the request, preventing a concurrent revocation from being bypassed. A member-visible reply never claims export or deletion occurred.
      security: [{session: []}]
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [status, response, expectedVersion], properties: {status: {type: string, enum: [reviewing, responded]}, waitingOn: {type: string, enum: [operator, member]}, response: {type: string, minLength: 1, maxLength: 4000}, expectedVersion: {type: integer, minimum: 1}}}}}
      responses: {'200': {description: Audited version-guarded reply; no execution implied}, '401': {description: Session required}, '403': {description: Capability unavailable or revoked}, '409': {description: Request changed or closed}, '422': {description: Invalid input}, '404': {description: Request not found}}
  /v1/admin/privacy-requests:
    get:
      operationId: privacyRequestQueue
      description: Requires a signed active operator session and support or review_lead role; a client-supplied principal cannot select the actor. Without page, returns the legacy array of up to 100; page=1 returns items (up to 30) and nextCursor.
      security: [{session: []}]
      parameters: [{name: page, in: query, schema: {type: string, enum: ['1']}}, {name: cursor, in: query, schema: {type: string, maxLength: 512}}]
      responses: {'200': {description: Requests with pending first}, '403': {description: Missing operator role}, '422': {description: Invalid page or cursor}}
  /v1/admin/privacy-requests/{requestId}/response:
    post:
      operationId: respondPrivacyRequest
      description: Requires a signed active operator session and support or review_lead role. Saves an auditable member-visible reply, not an automatic data operation.
      security: [{session: []}]
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [status, response, expectedVersion], properties: {status: {type: string, enum: [reviewing, responded]}, waitingOn: {type: string, enum: [operator, member]}, response: {type: string, minLength: 1, maxLength: 4000}, expectedVersion: {type: integer, minimum: 1}}}}}
      responses: {'200': {description: Version-guarded saved response; never proof of execution}, '409': {description: Request changed or closed}, '403': {description: Missing operator role}, '404': {description: Request not found}}
  /v1/admin/privacy-requests/{requestId}/execution-plan:
    post:
      operationId: planPrivacyRequestExecution
      description: Signed active review-lead session only; idempotent creation of one plan-only export job or dry-run erasure job. Does not read an export archive, delete data, close an account, approve a job, or run a job.
      security: [{session: []}]
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expectedVersion, reasonCode], properties: {expectedVersion: {type: integer, minimum: 1}, reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$'}}}}}
      responses: {'200': {description: Non-executing plan created or exact idempotent replay}, '409': {description: Stale, closed, already planned, or manual-only request}, '403': {description: Missing review_lead role}, '404': {description: Request not found}}
  /v1/admin/privacy-requests/{requestId}/export-approval:
    post:
      operationId: approveSyntheticProfileExport
      security: [{session: []}]
      description: Test environment only. A second signed review lead approves a fixed member-profile-only scope for a dev_test identity; never enables production execution.
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [reasonCode, expectedVersion], properties: {reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$'}, expectedVersion: {type: integer, minimum: 1}}}}}
      responses: {'200': {description: Approved synthetic job}, '403': {description: Missing role or second reviewer}, '409': {description: Plan not approvable}, '503': {description: Synthetic execution disabled}}
  /v1/admin/privacy-requests/{requestId}/erasure-approval:
    post:
      operationId: approveSyntheticProfileHandleErasure
      security: [{session: []}]
      description: Test environment only. A second signed review lead approves the member's explicit member_profile_handle_v1 scope only when an active synthetic retention policy and no legal hold exist. Never enables production apply or whole-account deletion.
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [reasonCode, expectedVersion], properties: {reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$'}, expectedVersion: {type: integer, minimum: 1}}}}}
      responses: {'200': {description: Approved synthetic scoped job}, '403': {description: Missing role or second reviewer}, '409': {description: Missing scope, policy, hold clearance, or current version}, '503': {description: Synthetic execution disabled}}
  /v1/admin/privacy-requests/{requestId}/execution-redrive:
    post:
      operationId: redriveExhaustedSyntheticPrivacyExecution
      security: [{session: []}]
      description: Test environment only. Signed review lead may auditably reset an exhausted synthetic export or explicitly scoped erasure after rechecking dev identity, fixed scope, and applicable policy/holds. No production execution.
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [reasonCode, expectedVersion], properties: {reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$'}, expectedVersion: {type: integer, minimum: 1}}}}}
      responses: {'200': {description: Audited synthetic redrive}, '403': {description: Missing review lead role}, '409': {description: Not exhausted or prerequisites absent}, '503': {description: Synthetic execution disabled}}
  /v1/me/privacy-requests/{requestId}/export:
    get:
      operationId: downloadOwnSyntheticProfileExport
      security: [{session: []}]
      description: Test-only private encrypted-at-rest profile subset. Member session, exact owner, unexpired and unrevoked artifact required; no-store response.
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: JSON profile subset}, '404': {description: Not owned, not ready, expired or revoked}, '503': {description: Synthetic execution disabled or key unavailable}}
  /v1/me/privacy-requests/{requestId}/export-revoke:
    post:
      operationId: revokeOwnSyntheticProfileExport
      security: [{session: []}]
      description: Test-only owner revocation of a synthetic export artifact; audited and no longer downloadable.
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Revoked}, '404': {description: Not owned or unavailable}, '503': {description: Synthetic execution disabled}}
  /v1/legal:
    get:
      operationId: currentLegalDocuments
      security: []
      description: Public full text and versions of active terms/privacy and optional separate cross_border notice; ready only when both exist. Never records acceptance.
      responses: {'200': {description: Current published documents and ready flag}}
  /v1/me/profile:
    get:
      operationId: readOwnMemberProfile
      security: [{session: []}]
      description: Own nickname, small canonical JPEG avatar, optional private WeChat handle, revision and community display review status. No other member contact details.
      responses: {'200': {description: Own profile}, '401': {description: Active member session required}}
    put:
      operationId: updateOwnMemberProfile
      security: [{session: []}]
      description: Updates only the current member. expectedVersion prevents stale edits; omitted only for legacy clients. Omitted avatar/handle/visibility preserve existing data. Null avatar removes it. Community identity is private unless explicitly requested and independently approved; nickname/avatar changes withdraw prior approval. Login never rewrites this profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 40}
                wechatHandle: {type: string, maxLength: 20}
                avatarDataUrl: {type: [string, 'null'], maxLength: 100000, description: JPEG data URI only; decoded with dimension/memory limits and re-encoded as a 128-pixel thumbnail. External and temporary URLs are rejected.}
                communityVisible: {type: boolean}
                expectedVersion: {type: integer, minimum: 0}
      responses: {'200': {description: Saved own profile with incremented revision}, '409': {description: Profile changed; reload before retry}, '422': {description: Invalid nickname or avatar}}
  /v1/team/member-profiles:
    get:
      operationId: pendingCommunityProfiles
      security: [{session: []}]
      description: Verified team members only; up to 50 pending public nickname/avatar requests. Excludes private contact information.
      responses: {'200': {description: Pending profiles}, '403': {description: Team access required}}
  /v1/team/member-profiles/{memberId}/review:
    post:
      operationId: reviewCommunityProfile
      security: [{session: []}]
      description: Requires independent team reviewer and the current revision; self-review, stale decisions and approval after withdrawal are rejected.
      parameters: [{name: memberId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision, expectedVersion, reason], properties: {decision: {type: string, enum: [approve, reject]}, expectedVersion: {type: integer, minimum: 0}, reason: {type: string, minLength: 2, maxLength: 200}}}}}
      responses: {'200': {description: Audited review}, '403': {description: Independent team reviewer required}, '409': {description: Profile or review changed}}
  /v1/me/phone:
    get:
      operationId: phoneBindingStatus
      security: [{session: []}]
      responses: {'200': {description: Only the caller masked phone and binding capability}}
    delete:
      operationId: unbindOwnPhone
      security: [{session: []}]
      description: Deletes the current member encrypted phone and blind index without changing their identity, care records or profile. Keeps only prior code-consumption and action audit evidence. Does not require the phone capability to be enabled.
      responses: {'200': {description: Unbound, idempotently}, '401': {description: Active member required}}
    post:
      operationId: bindWechatPhone
      security: [{session: []}]
      description: Exchanges a user-triggered one-time WeChat phone code, verifies app watermark, encrypts storage and uses a HMAC blind index. No automatic account merge or registration reward.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, minLength: 1, maxLength: 512}}}}}
      responses: {'200': {description: Bound and masked number}, '409': {description: Code consumed by another member or phone already bound}, '503': {description: Binding service unavailable}}
  /v1/me/community-access:
    get:
      operationId: communityCapabilities
      security: [{session: []}]
      responses: {'200': {description: Current environment-scoped community.moderate capability and canReview flag; legacy team rows do not authorize}}
  /v1/me/follows:
    get:
      operationId: followedAuthors
      security: [{session: []}]
      responses: {'200': {description: Caller followed author IDs}}
  /v1/me/following:
    get:
      operationId: followingFeed
      security: [{session: []}]
      responses: {'200': {description: Latest published content by followed authors; publication gate remains enforced}}
  /v1/me/following/page:
    get:
      operationId: followingFeedPage
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageLimit'}]
      responses: {'200': {description: Repeatable-read stable cursor page with de-duplicated public author projection}}
  /v1/me/follows/{authorId}:
    parameters: [{name: authorId, in: path, required: true, schema: {type: string}}]
    put:
      operationId: setFollow
      security: [{session: []}]
      description: Sets desired state idempotently; author must be CISME editorial or an author of published content.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [active], properties: {active: {type: boolean}}}}}
      responses: {'200': {description: Saved following state}, '422': {description: Invalid state or self follow}}
  /v1/team/reviews:
    get:
      operationId: nativeReviewQueue
      security: [{session: []}]
      description: Requires current database team membership and review role; client role headers are ignored.
      responses: {'200': {description: Pending submissions}, '403': {description: Team access denied}}
  /v1/team/publications:
    get:
      operationId: nativePublicationQueue
      security: [{session: []}]
      responses: {'200': {description: Approved submissions awaiting publication review}, '403': {description: Team access denied}}
  /v1/team/submissions/{submissionId}/review:
    parameters: [{name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: nativeReviewSubmission
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Same versioned evidence review as admin endpoint; only approve, reject or request_changes are accepted.
      responses: {'200': {description: Reviewed state}, '403': {description: Team access denied}, '409': {description: Version or state conflict}}
  /v1/team/submissions/{submissionId}/publish:
    parameters: [{name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: nativePublishSubmission
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Requires another review lead, active public-display consent, UGC gate and publication title/excerpt/AI declaration/evidence. Queues an audited publication event.
      responses: {'200': {description: Publication queued or already published}, '403': {description: Team access denied}, '409': {description: Four-eyes or consent conflict}, '503': {description: Publication gate closed}}
  /v1/uploads/{mediaId}/chunks:
    parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: cloudUploadChunk
      security: []
      description: Signed short-lived upload token required in body. Sequential 512 KiB base64 chunks, total at most 10 MiB. Replays must contain identical bytes. No final object is exposed to client writes.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token, index, totalBytes, base64], properties: {token: {type: string}, index: {type: integer, minimum: 0, maximum: 19}, totalBytes: {type: integer, minimum: 1, maximum: 10485760}, base64: {type: string, maxLength: 699052}}}}}
      responses: {'200': {description: Chunk durably received}, '401': {description: Invalid or expired token}, '409': {description: Conflict or wrong order}}
  /v1/uploads/{mediaId}/assemble:
    parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: assembleCloudUpload
      security: []
      description: Requires all chunks and same signed token; reuses submission/media locks and gateway validation. Member must still call existing media completion to verify and commit current evidence.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}}}}}
      responses: {'200': {description: Object written awaiting completion}, '409': {description: Incomplete or locked upload}}
  /health/live:
    get: {operationId: live, security: [], responses: {'200': {description: Process live}}}
  /health/ready:
    get: {operationId: ready, security: [], responses: {'200': {description: Database and object storage ready}}}
  /v1/identity/dev:
    post:
      tags: [Identity]
      operationId: devIdentity
      security: []
      description: Development adapter only; forbidden in staging and production.
      requestBody: {$ref: '#/components/requestBodies/Identity'}
      responses: {'200': {$ref: '#/components/responses/Identity'}, '503': {$ref: '#/components/responses/Problem'}}
  /v1/identity/wechat:
    post:
      tags: [Identity]
      operationId: wechatIdentity
      security: []
      requestBody: {$ref: '#/components/requestBodies/Identity'}
      responses: {'200': {$ref: '#/components/responses/Identity'}, '502': {$ref: '#/components/responses/Problem'}}
  /v1/qualifications/dev:
    post:
      tags: [Care]
      operationId: devQualification
      security: [{session: []}]
