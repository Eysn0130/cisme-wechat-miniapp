  /v1/management/members/{memberId}/sections/{section}:
    get: {operationId: managementMemberSection, security: [{session: []}], parameters: [{$ref: '#/components/parameters/MemberId'}, {name: section, in: path, required: true, schema: {type: string, enum: [referrals, own-orders, attributed-orders, posts]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageLimit'}], description: Section-specific capability checks keep profile, commission, orders and content separate., responses: {'200': {description: Keyset page with exact total, loadedCount and nextCursor}, '403': {$ref: '#/components/responses/Problem'}}}
  /v1/management/members/{memberId}/membership:
