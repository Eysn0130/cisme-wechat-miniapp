      parameters:
        - {in: path, name: orderId, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind], properties: {kind: {type: string, enum: [refund_only, return_refund]}, claimBasis: {type: string, enum: [other, no_reason, quality, wrong_item, missing_item, delivery_issue]}, reason: {type: string, maxLength: 500, description: May be empty for no_reason; otherwise at least three characters}, lines: {type: array, description: Selected original order-line IDs and quantities; omitted means all remaining, items: {type: object, required: [lineId, quantity], properties: {lineId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}}}}}}
      responses:
        '200': {description: Local case facts; channel refund success is a separate verified fact}
        '401': {description: Session required}
        '403': {description: Active member and current capability required}
        '404': {description: Owned case or order not found}
        '409': {description: State, version or idempotency conflict}
        '422': {description: Invalid bounded input}
        '503': {description: Money authorization unavailable}
  /v1/me/aftersales:
    get:
