      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}, {name: after, in: query, schema: {type: integer, minimum: 0}}, {name: before, in: query, schema: {type: integer, minimum: 1}}, {$ref: '#/components/parameters/PageLimit'}]
      responses: {'200': {description: support.read message cursor page}, '403': {description: support.read required}}
    post:
      tags: [Support, Authority]
      operationId: operatorReplySupport
      security: [{session: []}]
      description: Requires support.reply and caller ownership of the human_active conversation. AI has no write path here.
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportMessageInput'}}}}
      responses: {'200': {description: Persisted audited reply or exact retry}, '403': {description: support.reply required}, '409': {description: Claim required or idempotency conflict}}
  /v1/management/support/conversations/{conversationId}/claim:
    post:
      tags: [Support, Authority]
      operationId: claimSupportConversation
      security: [{session: []}]
      description: Requires support.assign. Row lock plus expectedVersion permits only one competing operator to claim.
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedVersion'}}}}
      responses: {'200': {description: Audited human_active assignment}, '403': {description: support.assign required}, '409': {description: Already assigned, resolved, or changed}}
  /v1/management/support/conversations/{conversationId}/read:
    post:
      tags: [Support, Authority]
      operationId: markOperatorSupportRead
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [lastSeenSequence], properties: {lastSeenSequence: {type: integer, minimum: 0}}}}}}
      responses: {'200': {description: support.read monotonic shared-team read cursor}}
  /v1/management/support/conversations/{conversationId}/resolve:
    post:
      tags: [Support, Authority]
      operationId: resolveSupportConversation
      security: [{session: []}]
      description: Requires support.reply, current assignment, explicit mobile confirmation and expectedVersion. A later member message reopens into waiting_human.
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedVersion'}}}}
      responses: {'200': {description: Audited resolved state}, '409': {description: Assignment or version conflict}}
  /v1/management/support/conversations/{conversationId}/member-context:
    post:
      tags: [Support, Authority]
      operationId: supportMemberContext
      security: [{session: []}]
      description: Requires member.support_view and records an audit event. Returns only nickname, member state, masked phone and join time; no address or care detail.
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}]
      responses: {'200': {description: Audited minimal support context}, '403': {description: member.support_view required}}
  /v1/management/support/conversations/{conversationId}/retention:
    get:
      tags: [Support, Authority]
      operationId: supportRetentionEligibility
      security: [{session: []}]
      description: Requires privacy.request.manage. Evaluates the approved active policy, resolved timestamp, and member/conversation legal holds without exposing message text or member identity.
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}]
      responses: {'200': {description: policy_pending, not_resolved, legal_hold, not_due, or eligible state}, '403': {description: privacy.request.manage required}}
  /v1/management/support/conversations/{conversationId}/purge:
    post:
      tags: [Support, Authority]
      operationId: purgeSupportConversation
      security: [{session: []}]
      description: Requires privacy.request.manage, an enforced active retention policy, elapsed duration, no active member or conversation legal hold, expectedVersion, and Idempotency-Key. Deletes exactly one conversation and its messages while preserving a minimal audit tombstone and body-free outbox event.
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedVersion'}}}}
      responses: {'200': {description: Purge receipt or exact idempotent replay}, '409': {description: Policy pending, not resolved, not due, stale version, or idempotency conflict}, '423': {description: Active legal hold}, '403': {description: privacy.request.manage required}}
  /v1/management/support/ai/status:
    get:
      tags: [Support, Authority]
      operationId: supportAiStatus
      security: [{session: []}]
      description: Requires support.read. Runtime remains PROVIDER INTEGRATION PENDING with no approved source, external transfer, business-write tool or auto-send.
      responses: {'200': {description: Provider, approved knowledge and safety-gate status}, '403': {$ref: '#/components/responses/Problem'}}
  /v1/management/support/conversations/{conversationId}/suggested-reply:
    post:
      tags: [Support, Authority]
      operationId: supportSuggestedReply
      security: [{session: []}]
      description: Requires support.reply and current human ownership. Returns only a cited draft for operator review; never persists or sends it. Currently returns PROVIDER INTEGRATION PENDING.
      parameters: [{$ref: '#/components/parameters/SupportConversationId'}]
      responses: {'200': {description: Cited suggested-reply draft when a provider and approved knowledge are separately enabled}, '409': {description: ownership conflict or ungrounded output}, '503': {description: provider, knowledge or timeout pending}}

components:
  securitySchemes:
    session: {type: http, scheme: bearer}
    adminToken: {type: apiKey, in: header, name: x-admin-token}
    adminPrincipal: {type: apiKey, in: header, name: x-principal-id}
  parameters:
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, maxLength: 256}, description: Opaque stable tuple cursor returned by the preceding page.}
    PageLimit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
    CommunityPostId: {name: postId, in: path, required: true, schema: {type: string, enum: [brand-scalp-ritual, brand-night-routine, brand-care-journal, brand-roots-check, brand-product-ritual]}}
    CommentId: {name: commentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    SupportConversationId: {name: conversationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    CycleId: {name: cycleId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    TaskId: {name: taskId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    SubmissionId: {name: submissionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ShareId: {name: shareId, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
    AddressId: {name: addressId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    OrderId: {name: orderId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
  requestBodies:
    Identity: {required: true, content: {application/json: {schema: {type: object, required: [displayName, consents], properties: {code: {type: string}, externalUserId: {type: string}, displayName: {type: string}, consents: {type: array, minItems: 2, items: {type: object, required: [documentType, version], properties: {documentType: {type: string}, version: {type: string}}}}}}}}}
  responses:
    CommunityPreview: {description: Persisted local-preview state with PostgreSQL-authoritative transactional aggregate version, content: {application/json: {schema: {type: object, required: [preview, liked, saved, likeCount, saveCount, commentCount, aggregateVersion, comments, truncated, nextCursor, asOf], properties: {preview: {const: true}, asOf: {type: string, format: date-time}, liked: {type: boolean}, saved: {type: boolean}, likeCount: {type: integer}, saveCount: {type: integer}, commentCount: {type: integer}, aggregateVersion: {type: integer, minimum: 0}, truncated: {type: boolean}, nextCursor: {type: [string, 'null']}, comments: {type: array, maxItems: 100, items: {type: object, required: [id, body, status, authorName, isMine, createdAt, likeCount, liked], properties: {id: {$ref: '#/components/schemas/Uuid'}, body: {type: string}, status: {enum: [pending, published, rejected, deleted]}, authorName: {type: string}, isMine: {type: boolean}, createdAt: {type: string, format: date-time}, parentId: {type: [string, 'null']}, replyToId: {type: [string, 'null']}, replyToName: {type: [string, 'null']}, likeCount: {type: integer}, liked: {type: boolean}}}}}}}}}
    Identity: {description: Member identity and short-lived signed session, content: {application/json: {schema: {type: object, required: [memberId, identityId, principalId, sessionToken], properties: {memberId: {$ref: '#/components/schemas/Uuid'}, identityId: {$ref: '#/components/schemas/Uuid'}, principalId: {type: string}, sessionToken: {type: string}}}}}}
    Care: {description: Authoritative care view, content: {application/json: {schema: {$ref: '#/components/schemas/CareView'}}}}
    Problem: {description: Versioned problem details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    CommerceQuoteInput: {type: object, additionalProperties: false, required: [skuId, quantity, addressId, addressVersion], properties: {skuId: {$ref: '#/components/schemas/Uuid'}, quantity: {type: integer, minimum: 1, maximum: 99}, addressId: {$ref: '#/components/schemas/Uuid'}, addressVersion: {type: integer, minimum: 1}}}
    CommerceOrderCreateInput: {type: object, additionalProperties: false, required: [quoteId], properties: {quoteId: {$ref: '#/components/schemas/Uuid'}}}
    CommerceOrderCancelInput: {type: object, additionalProperties: false, required: [expectedVersion, reason], properties: {expectedVersion: {type: integer, minimum: 1}, reason: {type: string, minLength: 3, maxLength: 500}}}
    CatalogSkuInput: {type: object, additionalProperties: false, required: [code, label, priceCents], properties: {code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{2,63}$'}, label: {type: string, minLength: 1, maxLength: 120}, priceCents: {type: integer, minimum: 1, maximum: 100000000}, active: {type: boolean}}}
    CatalogProductCreate: {type: object, additionalProperties: false, required: [code, name, sku], properties: {code: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,63}$'}, name: {type: string, minLength: 1, maxLength: 120}, subtitle: {type: string, maxLength: 240}, description: {type: string, maxLength: 4000}, imagePath: {type: [string, 'null'], description: Allowlisted packaged JPG only; media upload is outside R4-A}, sourceKind: {enum: [admin, synthetic_test]}, sku: {$ref: '#/components/schemas/CatalogSkuInput'}}}
    CatalogProductUpdate: {allOf: [{$ref: '#/components/schemas/CatalogProductCreate'}, {type: object, required: [expectedVersion, sku], properties: {expectedVersion: {type: integer, minimum: 1}, sku: {allOf: [{$ref: '#/components/schemas/CatalogSkuInput'}, {type: object, required: [id, expectedVersion, expectedPriceVersion], properties: {id: {$ref: '#/components/schemas/Uuid'}, expectedVersion: {type: integer, minimum: 1}, expectedPriceVersion: {type: integer, minimum: 1}}}]}}}]}
    ExpectedVersion: {type: object, additionalProperties: false, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}
    SupportMessageInput: {type: object, additionalProperties: false, required: [body, clientMessageId], properties: {body: {type: string, minLength: 1, maxLength: 4000}, clientMessageId: {type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$'}}}
    CareVersionCommandInput: {type: object, additionalProperties: false, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}
    CareMilestoneCommandInput: {type: object, additionalProperties: false, required: [expectedVersion, stepCodes, selfAssessment], properties: {expectedVersion: {type: integer, minimum: 1}, stepCodes: {type: array, minItems: 4, maxItems: 4, prefixItems: [{const: '00'}, {const: '01'}, {const: '02'}, {const: '03'}], items: false}, selfAssessment: {type: string, enum: [comfortable, neutral, attention]}}}
    Uuid: {type: string, format: uuid}
    Id: {type: object, required: [id], properties: {id: {$ref: '#/components/schemas/Uuid'}}}
    Milestone: {type: string, enum: [D1, D7, D14, D28]}
    CareRecordView: {type: object, required: [milestone, completedAt, protocolVersion, stepCodes, selfAssessment], properties: {milestone: {$ref: '#/components/schemas/Milestone'}, completedAt: {type: string, format: date-time}, protocolVersion: {type: string}, stepCodes: {type: array, items: {type: string, enum: ['00','01','02','03']}}, selfAssessment: {type: [string, 'null'], enum: [comfortable, neutral, attention, null]}}}
    CareArchiveView: {type: object, required: [id, phase, startedOn, timezone, protocolVersion, completed, due, next, version, scheduleOffsetDays, pausePolicy, records], properties: {id: {$ref: '#/components/schemas/Uuid'}, phase: {type: string, enum: [planned, active, paused, terminated, completed]}, startedOn: {type: [string, 'null'], format: date}, timezone: {type: string}, protocolVersion: {type: string}, completed: {type: array, items: {$ref: '#/components/schemas/Milestone'}}, due: {oneOf: [{$ref: '#/components/schemas/Milestone'}, {type: 'null'}]}, next: {oneOf: [{$ref: '#/components/schemas/Milestone'}, {type: 'null'}]}, version: {type: integer}, scheduleOffsetDays: {type: integer, minimum: 0}, pausePolicy: {type: object, properties: {enabled: {type: boolean}, maxDays: {type: integer, minimum: 0}, version: {type: [string, 'null']}}}, records: {type: array, items: {$ref: '#/components/schemas/CareRecordView'}}}}
    CareView: {oneOf: [{type: 'null'}, {allOf: [{$ref: '#/components/schemas/CareArchiveView'}, {type: object, properties: {history: {type: array, description: Previous care cycles, newest first. Present on GET /v1/me/care., items: {$ref: '#/components/schemas/CareArchiveView'}}}}]}]}
    DeliveryAddressInput: {type: object, additionalProperties: false, required: [recipientName, phone, province, city, district, detail, label], properties: {recipientName: {type: string, minLength: 1, maxLength: 40}, phone: {type: string, minLength: 6, maxLength: 24}, province: {type: string, minLength: 1, maxLength: 40}, city: {type: string, minLength: 1, maxLength: 40}, district: {type: string, minLength: 1, maxLength: 40}, detail: {type: string, minLength: 2, maxLength: 120}, postalCode: {type: string, maxLength: 12}, nationalCode: {type: string, maxLength: 12, description: Legacy district-level code alias}, provinceCode: {type: string, maxLength: 12}, cityCode: {type: string, maxLength: 12}, districtCode: {type: string, maxLength: 12}, label: {type: string, enum: [home, company, other]}, isDefault: {type: boolean}}}
    DeliveryAddressUpdateInput: {allOf: [{$ref: '#/components/schemas/DeliveryAddressInput'}, {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}]}
    DeliveryAddress: {allOf: [{$ref: '#/components/schemas/DeliveryAddressInput'}, {type: object, required: [id, isDefault, version, updatedAt], properties: {id: {$ref: '#/components/schemas/Uuid'}, isDefault: {type: boolean}, version: {type: integer, minimum: 1}, updatedAt: {type: string, format: date-time}}}]}
    DeliveryAddressList: {type: object, required: [enabled, maxAddresses, addresses], properties: {enabled: {type: boolean}, maxAddresses: {type: integer, const: 10}, addresses: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/DeliveryAddress'}}}}
    SubmissionInput: {type: object, required: [postUrl, platformAccount, disclosure, license, expectedVersion], properties: {postUrl: {type: string, maxLength: 500}, platformAccount: {type: string, maxLength: 120}, disclosure: {type: string, maxLength: 300}, license: {type: object, required: [content_storage, human_review, feed_readonly], properties: {content_storage: {const: true}, human_review: {const: true}, feed_readonly: {type: boolean, default: false, description: Optional public read-only publication consent; never required for review or base reward}}}, expectedVersion: {type: integer, minimum: 1}}}
    ReviewInput: {type: object, required: [decision, reasonCode, expectedVersion], properties: {decision: {type: string, enum: [request_changes, reject, approve]}, reasonCode: {type: string}, evidence: {type: object}, expectedVersion: {type: integer, minimum: 1}}}
    PointsActionInput: {type: object, required: [action, expectedGrantVersion, reasonCode, evidence], properties: {action: {type: string, enum: [unfreeze, expire, reverse_remaining]}, expectedGrantVersion: {type: integer, minimum: 1}, reasonCode: {type: string, minLength: 1}, evidence: {type: object, minProperties: 1}}}
    PointsDecisionInput: {type: object, required: [reasonCode, evidence], properties: {reasonCode: {type: string, minLength: 1}, evidence: {type: object, minProperties: 1}}}
    PublicationInput: {type: object, required: [title, excerpt, aiUsage, reasonCode, evidence], properties: {title: {type: string, minLength: 1, maxLength: 60}, excerpt: {type: string, minLength: 1, maxLength: 240}, aiUsage: {type: string, enum: [none, assisted, generated, unknown]}, reasonCode: {type: string, minLength: 1}, evidence: {type: object, minProperties: 1}}}
    TesterEnrollmentInput: {type: object, required: [memberId, qualificationType, externalRef, occurredAt, timezone, protocolVersion, reasonCode, evidence], properties: {memberId: {$ref: '#/components/schemas/Uuid'}, qualificationType: {type: string, enum: [verified_delivery, approved_tester_fulfillment]}, externalRef: {type: string, minLength: 1, maxLength: 200}, occurredAt: {type: string, format: date-time}, timezone: {type: string}, protocolVersion: {type: string, minLength: 1}, reasonCode: {type: string, minLength: 1}, evidence: {type: object, minProperties: 1}}}
    ShareInput: {type: object, required: [targetType, targetRef], properties: {targetType: {type: string, enum: [post, product, invite]}, targetRef: {type: string, minLength: 1, maxLength: 200}}}
    ShareVisitInput: {type: object, required: [visitKey], properties: {visitKey: {type: string, minLength: 16, maxLength: 100}}}
    Problem: {type: object, required: [type, title, status, code, trace_id], properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, code: {type: string}, trace_id: {type: string}}}
