name: cisme-r0
services:
  postgres:
    # Legacy persistent instance: never a test/reset target.
    profiles: [legacy-manual]
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: cisme
      POSTGRES_PASSWORD: cisme-dev-only
      POSTGRES_DB: cisme
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cisme -d cisme"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cisme-postgres:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
  seaweed:
    profiles: [legacy-manual]
    image: chrislusf/seaweedfs:4.29
    command:
      - server
      - -dir=/data
      - -ip=seaweed
      - -master.port=9333
      - -filer=true
      - -filer.port=8888
      - -s3=true
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.iam=false
    ports:
      - "59333:9333"
      - "58888:8888"
      - "58333:8333"
    volumes:
      - cisme-seaweed:/data
      - ./seaweed-s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  cisme-postgres:
  cisme-seaweed:
