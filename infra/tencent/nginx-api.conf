# Candidate HTTPS listener. Keep external firewall closed until filing and cutover.
server {
    listen 443 ssl;
    server_name api.cisme.cn;
    ssl_certificate /etc/letsencrypt/live/api.cisme.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cisme.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
